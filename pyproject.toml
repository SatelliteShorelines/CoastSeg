[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
  {name = " Sharon Fitzpatrick Batiste", email = "sharon.fitzpatrick23@gmail.com"},
]
description = "An interactive python package for satellite derived shoreline workflows"
keywords = [
  "coastseg",
  "coastsat",
  "coastal change",
  "shoreline extraction",
  "satellite imagery",
  "geospatial",
  "remote sensing",
  "gee",
]
name = "coastseg"
readme = "README.md"
version = "2.1.2"
#these dependencies are the core dependencies of the package necessary for the coastsat workflow and the core functionality. Pixi reads these as pypi dependencies
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: GIS",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "aiohttp",
  "onnxruntime",
  "chardet",
  "dask",
  # 0.5.0 is the first release with the enhanced SAR workflow
  "coastsat-package>=0.5.1",
  "geojson",
  "geopandas",
  "h5py",
  "jupyterlab>=3.0.0",
  "leafmap",
  "nest-asyncio",
  "pooch",
  "protobuf",
  "pytmd>=3.0.9,<4",
  "timescale>=0.1.1",
  "xarray",
  "pytz",
  "netcdf4",
]
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.13"
# this is needed to tell hatchling to use the src directory as the source directory for the package
[tool.hatch.build.targets.wheel]
packages = ["src/coastseg"]

[project.optional-dependencies]
test = ["pytest"] # dependencies for testing

[tool.pytest.ini_options]
minversion = "7.0" # Minimum required pytest version
testpaths = ["tests"]
# -ra: show extra test summary info for all except passed
# --strict-markers: raise errors for unregistered custom markers
# --strict-config : aboirt the test run with error if there is a unrecognized configuration option
addopts = "-ra --strict-markers --strict-config"
# tide model : tags tests that require FES tide model to be present. Skip tests that require it with pytest -m "not tide_model" 
# slow : tag tests that take more than a few seconds to run. Run pytest -m "not slow" to run all tests including slow ones.
markers = [
  "tide_model: needs the FES tide model on disk (CoastSeg/tide_model, or $COASTSEG_TIDE_MODEL)",
  "slow: takes more than a few seconds to run",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
coastseg = {path = ".", editable = true}

# this tells pixi to install these packages (they are the same as the dependencies) from the conda-forge channel
# Note: pytmd is purposely not included here because it causes conflicts when installed from conda-forge
[tool.pixi.dependencies]
netcdf4 = "*" # prefer to have this installed from conda-forge because it can cause conflicts on MacOS when installed from pip
# Pin the CPU build of onnx to avoid heavy GPU based cuda installation
onnxruntime = { version = "*", build = "*cpu*" }
aiohttp = "*"
area = "*"
chardet = "*"
dask = "*"
gdal = "*"
geojson = "*"
geopandas = "*"
ipyfilechooser = ">=0.6.0,<0.7"
ipyleaflet = "*"
jupyterlab = ">=3.0.0"
leafmap = "*"
nest-asyncio = "*"
pooch = "*"
xarray = "*"
pytz = "*"
scikit-image = "*"
# pyTMD 3 runtime dependencies. pytmd itself still comes from PyPI (see note above),
# but these are better as conda-forge builds and pixi lets them satisfy pytmd's PyPI requirements.
h5netcdf = "*"
lxml = "*"
pint = "*"
platformdirs = "*"
pyproj = ">=2.5.0"

# tells setup tools to include the code in the coastseg directory within the src directory
[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.feature.test.dependencies]
pytest = "*"

[tool.pixi.tasks]
validate_numpy = "python -c \"import numpy as np; print('NumPy version:', np.__version__); assert np.array([1, 2, 3]).sum() == 6; print('NumPy validation passed')\""

[project.urls]
"Bug Tracker" = "https://github.com/SatelliteShorelines/CoastSeg/issues"
documentation = "https://github.com/SatelliteShorelines/CoastSeg/wiki"
homepage = "https://github.com/SatelliteShorelines/CoastSeg"
repository = "https://github.com/SatelliteShorelines/CoastSeg"

[tool.pixi.environments]
default = {features = [], solve-group = "default"}# default base environment with all the CoastSat workflow dependencies
test = {features = ["test"], solve-group = "default"}# Test environment with pytest dependency

[tool.pixi.feature.test.tasks]
run_tests = "pytest tests"
# everything except the tests that take more than a few seconds
run_tests_fast = "pytest tests -m 'not slow'"
# exactly what CI runs: $CI makes tests/conftest.py deselect every 'tide_model'
# test and fail any other test that reads a real model off disk
run_tests_as_ci = {cmd = "pytest tests", env = {COASTSEG_NO_TIDE_MODEL = "1"}}
# the tide-correction suite; the pyTMD tests need the FES model under
# CoastSeg/tide_model (or $COASTSEG_TIDE_MODEL) and skip themselves without it
test_tides = "pytest tests/test_tide_*.py -v -s"
# only the parts that need no tide model on disk
test_tides_offline = "pytest tests/test_tide_*.py -m 'not tide_model' -v"

[tool.hatch.build]
exclude = [
  #  Development and CI files/folders
  "models/**",
  "paper/**",
  "debug/**",
  "debug_scripts/**",
  "docker_files/**",
  "old_docker/**",
  "ci/**",
  ".github/**",
  ".gitignore",
  ".gitattributes",
  "scripts/**", # Testing and docs
  "tests/**",
  "docs/**", # Build-related and environment files
  "requirements.txt",
  "requirements_dev.txt",
  "*pixi*",
  "*.lock", #  Bytecode and metadata
  "**/__pycache__/**",
  "*.egg-info/**", # Source code and notebooks
  "*.ipynb", # Jupyter notebooks
  "*docker*", # Any docker-related files
  # Data and models
  "*.h5",
  "*.npy",
  "models/**", # Scripts
  "0_test_download_imagery_workflow.py",
  "1_download_imagery.py",
  "2_extract_shorelines.py",
  "3_zoo_workflow.py",
  "5_zoo_workflow_local_model.py",
  "6_zoo_workflow_with_coregistration.py",
  "7_automatic_image_sorter.py",
  "run_image_classifier.py",
  "run_shoreline_segmentation_classifier.py",
]
