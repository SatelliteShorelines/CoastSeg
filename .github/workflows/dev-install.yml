name: Dev install (editable)

# Tests the code on this branch, installed the way a contributor works on it:
#  pip install -e ".[test]"
# Every dependency is resolved from this branch's pyproject.toml, so a missing
# requirement, a bad bound, or a conflict introduced by the commit under review
# fails here.

on:
  push:
    branches: [main, develop, "dev/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  editable:
    name: editable / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        shell: bash -el {0}
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      # A bare env: python plus gdal from conda-forge. gdal is the one runtime
      # dependency coastseg needs that is not in pyproject.toml (there is no
      # reliable PyPI wheel), so it is the only thing conda provides here.
      # Everything else comes from pip and this branch's pyproject.toml.
      - name: Create the conda environment (python + gdal only)
        timeout-minutes: 8
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: coastseg-dev
          create-args: >-
            python=${{ matrix.python-version }}
            pip
            gdal
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict
          cache-downloads: true
          init-shell: bash
          post-cleanup: none

      - name: pip install -e ".[test]"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      # `pip check` fails on any unmet or conflicting requirement. The import of
      # coastseg.__file__ proves the editable install points at the checkout,
      # not at a copy in site-packages.
      - name: Verify the editable install
        env:
          REPO_ROOT: ${{ github.workspace }}
        run: |
          python -m pip check
          python -c "
          import os, sys, pathlib, numpy, geopandas
          from osgeo import gdal
          import coastseg
          src = pathlib.Path(coastseg.__file__).resolve()
          repo = pathlib.Path(os.environ['REPO_ROOT']).resolve()
          assert repo in src.parents, f'coastseg imported from {src}, not from the checkout {repo}'
          print('python   ', sys.version.split()[0])
          print('gdal     ', gdal.__version__)
          print('numpy    ', numpy.__version__)
          print('geopandas', geopandas.__version__)
          print('coastseg ', coastseg.__version__, 'from', src)
          "

      - name: Run the test suite
        run: python -m pytest -q tests