name: Test CoastSeg Pixi Installation (pixi run test)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Allow to run on demand before a release.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.66.0
          manifest-path: pyproject.toml
          environments: test
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'develop' }}
          locked: true

      - name: Run tests with Pixi
        run: pixi run -e test run_tests