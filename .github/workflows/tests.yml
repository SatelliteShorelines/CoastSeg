name: Tests

on:
  push:
    # push to any dev/<name> branch to run the full matrix without opening a PR.
    branches: [main, develop, "dev/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      source:
        description: >-
          checkout: install the documented way, then test the code in this commit.
          published: test the released package exactly as a user receives it.
        type: choice
        options: [checkout, published]
        default: checkout

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede in-flight runs on PRs and ci/** branches; never abandon one on main
  # or develop.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: the documented "Method #2: Install from PyPI" path, step for step:
  #   https://satelliteshorelines.github.io/CoastSeg/basic-install-guide/#method-2-install-from-pypi
  #     1. conda create --name coastseg python=3.11
  #     2. conda activate coastseg
  #     3. pip install coastseg
  #     4. conda install -c conda-forge gdal
  # The environment starts with nothing but python and pip, so pip must resolve
  # every dependency from pyproject.toml on its own; a missing requirement, a
  # bound with no wheel, or a conflict shows up here. Step 4 then checks that
  # conda-forge gdal can be layered on afterwards without breaking what pip put
  # down -- the order a real user does it in.
  #
  # By default step 3 installs the code from this checkout (`pip install .`) so
  # the job tests the commit under review. Dispatch the workflow with
  # source=published to run the literal `pip install coastseg` against the
  # PyPI release instead.
  # ---------------------------------------------------------------------------
  pypi-install:
    name: pypi-install / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        shell: bash -el {0}
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v5

      # Steps 1 + 2 of the guide: a bare conda env with just python, activated.
      - name: Create and activate the conda environment
        timeout-minutes: 5
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: coastseg
          create-args: >-
            python=${{ matrix.python-version }}
            pip
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict
          cache-downloads: true
          init-shell: bash
          post-cleanup: none

      # Step 3 of the guide.
      - name: pip install coastseg
        run: |
          if [ "${{ github.event.inputs.source }}" = "published" ]; then
            python -m pip install coastseg
          else
            python -m pip install .
          fi
          python -m pip install pytest

      # Step 4 of the guide.
      - name: conda install -c conda-forge gdal
        timeout-minutes: 10
        run: micromamba install -y -n coastseg -c conda-forge gdal

      # `pip check` fails on any unmet or conflicting requirement among the
      # installed distributions. The import line proves the conda gdal install
      # did not replace numpy or geopandas with something coastseg cannot load.
      - name: Verify the install works
        run: |
          python -m pip check
          python -c "
          import sys, numpy, geopandas
          from osgeo import gdal
          import coastseg
          # conftest.py imports coastseg_map, which pulls in the whole tide
          # stack (pyTMD 3 + timescale). Import it here so a broken dependency
          # set fails with a readable traceback instead of pytest exit code 4.
          import pyTMD, timescale
          from coastseg import coastseg_map, roi
          major = int(pyTMD.__version__.split('.')[0])
          assert major >= 3, f'pyTMD {pyTMD.__version__} installed; coastseg needs >=3.0.9'
          print('python   ', sys.version.split()[0])
          print('gdal     ', gdal.__version__)
          print('numpy    ', numpy.__version__)
          print('geopandas', geopandas.__version__)
          print('pyTMD    ', pyTMD.__version__)
          print('timescale', timescale.__version__)
          print('coastseg ', coastseg.__version__)
          "

      - name: Run the test suite
        run: python -m pytest -q tests

  # ---------------------------------------------------------------------------
  # Job 2: the documented "Method #1: Install from conda-forge (Recommended)"
  # path, step for step:
  #   https://satelliteshorelines.github.io/CoastSeg/basic-install-guide/#method-1-install-from-conda-forge-recommended
  #     1. conda create --name coastseg python=3.11
  #     2. conda activate coastseg
  #     3. conda install -c conda-forge coastseg
  # Step 3 can only install the published conda-forge package, whose pins live
  # in the feedstock, not in this repo. So by default the job then overlays the
  # code from this checkout with `pip install --no-deps .` the dependency set
  # a user gets, running the commit under review. Dispatch with source=published
  # to skip the overlay and test the release exactly as a user receives it.
  # ---------------------------------------------------------------------------
  conda-forge-install:
    name: conda-forge-install / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash -el {0}
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v5

      # Steps 1 + 2 of the guide: a bare conda env with just python, activated.
      # pip is listed explicitly because `conda create python=X` adds it
      # automatically (add_pip_as_python_dependency) and micromamba does not;
      # without it the env also lacks setuptools/pkg_resources, which leafmap's
      # import chain needs, and pip check cannot run.
      - name: Create and activate the conda environment
        timeout-minutes: 5
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: coastseg
          create-args: >-
            python=${{ matrix.python-version }}
            pip
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict
          cache-downloads: true
          init-shell: bash
          post-cleanup: none

      # Step 3 of the guide. A solve that has not converged in 15 minutes never
      # will; fail it here rather than burning the whole job budget.
      - name: conda install -c conda-forge coastseg
        timeout-minutes: 15
        run: micromamba install -y -n coastseg -c conda-forge coastseg pytest

      - name: Verify the published install is self-consistent
        run: |
          micromamba list -n coastseg coastseg || true   # informational only
          rc=0
          out=$(python -m pip check 2>&1) || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "pip check: OK"
          else
            echo "pip check exit code: $rc"
            echo "$out"
            ours=$(echo "$out" | grep -iE '^(coastseg|coastsat[-_]package) ' || true)
            theirs=$(echo "$out" | grep -viE '^(coastseg|coastsat[-_]package) ' || true)
            if [ -n "$theirs" ]; then
              echo "::warning title=Third-party conda-forge inconsistency::$(echo "$theirs" | tr '\n' ' ')"
            fi
            if [ -n "$ours" ]; then
              echo "::error title=coastseg requirements not satisfied::$(echo "$ours" | tr '\n' ' ')"
              exit 1
            fi
          fi

      - name: Overlay the code from this checkout
        if: github.event.inputs.source != 'published'
        run: python -m pip install --no-deps .

      # After the overlay, pip check compares this branch's pyproject.toml
      # requirements against what the feedstock chose to install. The two are
      # maintained separately and are allowed to drift, so a mismatch is surfaced
      # as a warning annotation, not a failure: it means the feedstock recipe
      # needs updating before the next release.
      - name: Report pyproject vs feedstock drift
        if: github.event.inputs.source != 'published'
        run: |
          if ! out=$(python -m pip check 2>&1); then
            echo "$out"
            echo "::warning title=pyproject/feedstock drift::conda-forge coastseg's dependencies do not satisfy this branch's pyproject.toml. Update the feedstock recipe before releasing. Details: $(echo "$out" | tr '\n' ' ')"
          fi

      - name: Verify the install works
        run: |
          python -c "
          import sys, numpy, geopandas
          from osgeo import gdal
          import coastseg
          # conftest.py imports coastseg_map, which pulls in the whole tide
          # stack (pyTMD 3 + timescale). Import it here so a broken dependency
          # set fails with a readable traceback instead of pytest exit code 4.
          import pyTMD, timescale
          from coastseg import coastseg_map, roi
          major = int(pyTMD.__version__.split('.')[0])
          assert major >= 3, f'pyTMD {pyTMD.__version__} installed; coastseg needs >=3.0.9'
          print('python   ', sys.version.split()[0])
          print('gdal     ', gdal.__version__)
          print('numpy    ', numpy.__version__)
          print('geopandas', geopandas.__version__)
          print('pyTMD    ', pyTMD.__version__)
          print('timescale', timescale.__version__)
          print('coastseg ', coastseg.__version__)
          "

      - name: Run the test suite
        run: python -m pytest -q tests